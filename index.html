    <script>
      // Before first paint: apply the saved theme, and if the saved language or
      // focus differs from the prerendered page (en, embedded), show the boot
      // screen until the app has switched (App#finishBoot). The timeout lifts it
      // if the app never loads.
      (function () {
        var d = document.documentElement;
        var get = function (k) {
          try {
            return localStorage.getItem('vm-cv2.' + k);
          } catch (e) {
            return null;
          }
        };
        var theme = get('theme');
        d.setAttribute('data-theme', theme === 'light' || theme === 'night' ? theme : 'dark');
        var lang = get('lang') === 'ua' ? 'ua' : 'en';
        var role = null;
        try {
          role = new URLSearchParams(location.search).get('role');
        } catch (e) {}
        if (role !== 'embedded' && role !== 'software') role = get('role');
        if (lang === 'en' && role !== 'software') return;
        d.setAttribute('data-boot', '');
        setTimeout(function () {
          d.removeAttribute('data-boot');
        }, 4000);
        if (lang !== 'ua') return;
        d.lang = 'uk';
        ['sans-cyrillic-300', 'sans-cyrillic-400', 'mono-cyrillic-400', 'mono-cyrillic-500'].forEach(function (f) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'font';
          l.type = 'font/woff2';
          l.crossOrigin = 'anonymous';
          l.href = '/fonts/ibm-plex-' + f + '.woff2';
          document.head.appendChild(l);
        });
      })();
    </script>
