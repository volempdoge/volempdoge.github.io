    <script>
      // Before first paint. The page is prerendered per language (/ and /uk/),
      // with the embedded focus and the dark theme:
      // - a reader who chose Ukrainian before is sent from / to /uk/;
      // - the saved theme is applied;
      // - a saved or linked software focus shows the boot screen until the app
      //   has switched (App#finishBoot); the timeout lifts it if the app never loads.
      (function () {
        var d = document.documentElement;
        var get = function (k) {
          try {
            return localStorage.getItem('vm-cv2.' + k);
          } catch (e) {
            return null;
          }
        };
        if (location.pathname === '/' && get('lang') === 'ua') {
          location.replace('/uk/' + location.search + location.hash);
          return;
        }
        var theme = get('theme');
        d.setAttribute('data-theme', theme === 'light' || theme === 'night' ? theme : 'dark');
        var role = null;
        try {
          role = new URLSearchParams(location.search).get('role');
        } catch (e) {}
        if (role !== 'embedded' && role !== 'software') role = get('role');
        if (role !== 'software') return;
        d.setAttribute('data-boot', '');
        setTimeout(function () {
          d.removeAttribute('data-boot');
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
